[project]
name = "stou"
version = "0.1.0"
description = "Curador multi-fuente con IA para desarrolladores"
readme = "README.md"
authors = [{ name = "Samuel Botina", email = "samuelmusic4s@gmail.com" }]
requires-python = "==3.12.14"
dependencies = [
  "openai>=3.52.0",
  "pymongo>=4.20.0",
  "pypdf>=7.1.0",
  "pyside6>=6.12.0",
  "python-dotenv>=1.2.4",
]

[project.scripts]
stou = "stou:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"


[tool.ruff]
src = ["src"]

[dependency-groups]
dev = ["pyinstaller>=6.22.3"]
